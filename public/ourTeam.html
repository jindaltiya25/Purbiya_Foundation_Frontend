    <script>
        async function loadTeamMembers() {

            const container = document.getElementById("teamContainer");

            try {

                container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">
                            Loading...
                        </span>
                    </div>

                    <p class="mt-3">
                        Loading team members...
                    </p>
                </div>
            `;


                const response = await fetch("/api/team");


                if (!response.ok) {
                    throw new Error("Failed to load team members");
                }


                const result = await response.json();


                if (!result.success) {
                    throw new Error(
                        result.message || "Unable to load team members"
                    );
                }


                const teamData = result.data || [];


                if (teamData.length === 0) {

                    container.innerHTML = `
                    <div class="col-12">
                        <div class="text-center py-5">
                            <h5>
                                No team members found.
                            </h5>
                        </div>
                    </div>
                `;

                    return;
                }


                container.innerHTML = teamData.map(member => `

                <div class="col-lg-4 col-md-6">

                    <div class="gf-volunteer-card h-100">

                        <div class="gf-volunteer-image text-center">

                            <img
                                src="${member.image || "/assets/images/Director.jpeg"}"
                                class="image"
                                alt="${member.name || "Team Member"}"
                                style="
                                    height: 260px;
                                    width: 260px;
                                    border: 5px solid #f15b43;
                                    border-radius: 50%;
                                    overflow: hidden;
                                    object-fit: cover;
                                "
                            >

                            
                            

                        </div>


                        <div class="gf-volunteer-body">

                            <h4 class="text-center px-0 name">
                                ${member.name || ""}
                            </h4>


                            <p
                                class="gf-volunteer-role text-center px-0 designation"
                                style="color: #f15b43;"
                            >
                                ${member.designation || ""}
                            </p>


                            <p class="text-center">
                                ${member.description || ""}
                            </p>

                        </div>

                    </div>

                </div>

            `).join("");


            } catch (error) {

                console.error("Team loading error:", error);


                container.innerHTML = `
                <div class="col-12">

                    <div class="alert alert-danger text-center">
                        Unable to load team members.
                    </div>

                </div>
            `;

            }

        }

        // Load team members
        loadTeamMembers();
    </script>
